name = "alfie-proxy"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare's own AI, which is what Ask Alfie uses by default. ⚠️ NO KEY AND NO CARD: the Workers
# Free plan includes 10,000 Neurons a day, and on that plan usage above it cannot be billed — requests
# simply fail, and the app falls back to its on-device answers. That is the whole reason this is the
# default over Claude: there is no bill to run up, only an allowance to exhaust.
[ai]
binding = "AI"

# Secrets are NOT set here — never commit a key. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY     # ONLY if BRAIN is switched to "claude"
#   npx wrangler secret put STRAVA_CLIENT_ID      # only for Strava
#   npx wrangler secret put STRAVA_CLIENT_SECRET  # only for Strava
#   npx wrangler secret put ALLOWED_ORIGINS       # e.g. https://padder1980.github.io
#
# Either half works alone: with no Strava credentials set, the app is simply not offered Strava.

# Where the runners' Strava tokens live. ⚠️ Create it once and paste the id below — a placeholder id
# deploys cleanly and then fails at runtime with "not configured", which reads as a code bug:
#   npx wrangler kv namespace create STRAVA
[[kv_namespaces]]
binding = "STRAVA"
id = "52ff9e8a2b944d058efabc3abe33ad1c"

# ⚠️ KV CANNOT STOP A BURST, AND THAT IS WHY THIS BINDING EXISTS. KV reads are eventually consistent —
# cached at the edge for up to a minute — so rapid successive questions all read the same stale count
# and sail past a KV-only cap. Measured against the deployed Worker: 31 requests in a few seconds left
# the counter reading 21 and never tripped a limit of 30. This binding is Cloudflare's own counter and
# is accurate at seconds resolution, so it owns the burst; KV still owns the daily budget, where a
# minute of lag does not matter.
[[unsafe.bindings]]
name = "BURST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
